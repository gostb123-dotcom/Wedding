<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Приглашение на свадьбу — Светлана & Евгений</title>

    <!-- Google Fonts & FontAwesome -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Great+Vibes&family=Montserrat:wght@200;300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Заглушка для favicon -->
    <link rel="shortcut icon" href="data:image/x-icon;," type="image/x-icon">

    <style>
        /* ===== GENERAL RESET ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cormorant Garamond', serif;
            background-color: #ffffff;
            color: #1a1a1a;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        body.no-scroll {
            overflow: hidden;
        }

        /* ===== WELCOME OVERLAY ===== */
        #welcome-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #ffffff;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }

        #welcome-overlay.hidden {
            opacity: 0;
            visibility: hidden;
        }

        .overlay-title {
            font-size: 28px;
            letter-spacing: 5px;
            text-transform: uppercase;
            font-family: 'Montserrat', sans-serif;
            font-weight: 200;
            margin-bottom: 30px;
        }

        .enter-btn {
            background: none;
            border: 1px solid #1a1a1a;
            padding: 12px 30px;
            font-family: 'Montserrat', sans-serif;
            font-size: 13px;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .enter-btn:hover {
            background-color: #1a1a1a;
            color: #ffffff;
        }

        /* ===== MUSIC TOGGLE BUTTON ===== */
        .music-btn {
            position: fixed;
            top: 25px;
            right: 25px;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: 1px solid #1a1a1a;
            background: rgba(255, 255, 255, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 1000;
            transition: transform 0.3s ease;
        }

        .music-btn.playing {
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }

        /* ===== MAIN CONTAINER ===== */
        .container {
            width: 100%;
            max-width: 600px;
            padding: 20px;
        }

        section {
            padding: 60px 0;
            text-align: center;
        }

        .divider {
            width: 80px;
            height: 1px;
            background-color: #1a1a1a;
            margin: 20px auto;
        }

        /* ===== HERO SECTION ===== */
        .hero {
            min-height: 80vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .hero-content {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            gap: 25px;
            width: 100%;
        }

        .monogram-box {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .initial {
            font-size: 110px;
            font-family: 'Cormorant Garamond', serif;
            font-weight: 300;
            line-height: 0.9;
        }

        .line {
            width: 70px;
            height: 1px;
            background-color: #1a1a1a;
            margin: 15px 0;
        }

        .name {
            font-family: 'Montserrat', sans-serif;
            font-size: 14px;
            letter-spacing: 4px;
            text-transform: uppercase;
            font-weight: 300;
        }

        .ampersand {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-size: 30px;
            margin: 8px 0;
        }

        .hero-photo {
            width: 220px;
            height: 330px;
            object-fit: cover;
            filter: grayscale(100%);
            border-radius: 4px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
        }

        /* ===== TIMER SECTION ===== */
        .countdown-grid {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }

        .count-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .count-number {
            font-size: 42px;
            font-weight: 300;
            line-height: 1;
        }

        .count-label {
            font-family: 'Montserrat', sans-serif;
            font-size: 10px;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-top: 8px;
            color: #666;
        }

        /* ===== LOVE QUOTE SECTION ===== */
        .quote-text {
            font-family: 'Great Vibes', cursive;
            font-size: 38px;
            line-height: 1.3;
            margin-bottom: 30px;
        }

        .love-photo-img {
            width: 320px;
            height: 420px;
            object-fit: cover;
            filter: grayscale(100%);
            border-radius: 4px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            transform: rotate(2deg);
        }

        /* ===== COUPLE SECTION (УВЕЛИЧЕННЫЕ ФОТО) ===== */
        .couple-photos {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-bottom: 25px;
        }

        .couple-photo {
            width: 200px;
            height: 280px;
            object-fit: cover;
            filter: grayscale(100%);
            border-radius: 4px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
        }

        .couple-photo:first-child {
            transform: rotate(-3deg);
        }

        .couple-photo:last-child {
            transform: rotate(3deg);
        }

        .couple-names {
            display: flex;
            justify-content: center;
            gap: 60px;
            font-family: 'Great Vibes', cursive;
            font-size: 36px;
        }

        /* ===== RSVP CARD (СТИЛЬ КАРТОЧКИ СО СКРЕПКОЙ) ===== */
        .rsvp-section {
            display: flex;
            justify-content: center;
            padding: 40px 10px;
        }

        .paper-card {
            position: relative;
            background: #fdfdfd;
            background-image: linear-gradient(to bottom, #ffffff, #f7f7f7);
            width: 100%;
            max-width: 480px;
            padding: 50px 30px 45px 30px;
            border-radius: 2px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.08), 0 2px 6px rgba(0, 0, 0, 0.04);
            border: 1px solid #eaeaea;
            text-align: center;
        }

        /* Скрепка */
        .clip-icon {
            position: absolute;
            top: -15px;
            left: 25px;
            width: 28px;
            height: auto;
            filter: drop-shadow(2px 3px 2px rgba(0,0,0,0.15));
        }

        .rsvp-title {
            font-family: 'Montserrat', sans-serif;
            font-size: 26px;
            font-weight: 300;
            letter-spacing: 6px;
            text-transform: uppercase;
            color: #222;
            margin-bottom: 25px;
        }

        .rsvp-subtitle {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-size: 22px;
            color: #333;
            line-height: 1.4;
        }

        /* ===== MAP SECTION ===== */
        .location-section {
            width: 100%;
            text-align: center;
            padding-bottom: 60px;
        }

        .location-title {
            font-family: 'Montserrat', sans-serif;
            font-size: 16px;
            letter-spacing: 4px;
            text-transform: uppercase;
            font-weight: 300;
            margin-bottom: 15px;
        }

        .location-address {
            font-size: 18px;
            margin-bottom: 25px;
            color: #444;
        }

        .map-wrapper {
            width: 100%;
            height: 380px;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
            border: 1px solid #eee;
        }

        .map-wrapper iframe {
            width: 100%;
            height: 100%;
            border: 0;
        }

        /* ===== RESPONSIVE (МОБИЛЬНЫЕ НАСТРОЙКИ) ===== */
        @media (max-width: 480px) {
            html {
                font-size: 14px;
            }

            .hero-content {
                gap: 12px;
            }

            .initial {
                font-size: 75px;
            }

            .hero-photo {
                width: 150px;
                height: 225px;
            }

            .quote-text {
                font-size: 30px;
            }

            .love-photo-img {
                width: 250px;
                height: 330px;
            }

            /* Адаптив увеличенных фото пары */
            .couple-photos {
                gap: 12px;
            }

            .couple-photo {
                width: 160px;
                height: 220px;
            }

            .couple-names {
                gap: 40px;
                font-size: 30px;
            }

            .paper-card {
                padding: 40px 20px 35px 20px;
            }

            .rsvp-title {
                font-size: 20px;
                letter-spacing: 4px;
            }

            .rsvp-subtitle {
                font-size: 18px;
            }

            .map-wrapper {
                height: 300px;
            }
        }
    </style>
</head>
<body class="no-scroll">

    <!-- WELCOME OVERLAY -->
    <div id="welcome-overlay">
        <div class="overlay-title">Приглашение</div>
        <button class="enter-btn" id="enter-btn">Открыть</button>
    </div>

    <!-- MUSIC PLAYER & TOGGLE -->
    <button class="music-btn" id="music-toggle" title="Включить/Выключить музыку">
        <i class="fa-solid font-awesome-icon fa-music"></i>
    </button>

    <audio id="wedding-music" loop preload="auto">
        <source src="./music.mp3" type="audio/mpeg">
    </audio>

    <div class="container">
        
        <!-- SECTION 1: HERO -->
        <section class="hero">
            <div class="hero-content">
                <div class="monogram-box">
                    <div class="initial">С</div>
                    <div class="line"></div>
                    <div class="name">Светлана</div>
                    <div class="ampersand">&</div>
                    <div class="name">Евгений</div>
                    <div class="line"></div>
                    <div class="initial">Е</div>
                </div>
                <img src="./photo1.jpg" alt="Светлана и Евгений" class="hero-photo">
            </div>
        </section>

        <div class="divider"></div>

        <!-- SECTION 2: TIMER -->
        <section class="timer-section">
            <div class="countdown-grid">
                <div class="count-item">
                    <span class="count-number" id="weeks">00</span>
                    <span class="count-label">Недель</span>
                </div>
                <div class="count-item">
                    <span class="count-number" id="days">00</span>
                    <span class="count-label">Дней</span>
                </div>
                <div class="count-item">
                    <span class="count-number" id="hours">00</span>
                    <span class="count-label">Часов</span>
                </div>
                <div class="count-item">
                    <span class="count-number" id="minutes">00</span>
                    <span class="count-label">Минут</span>
                </div>
                <div class="count-item">
                    <span class="count-number" id="seconds">00</span>
                    <span class="count-label">Секунд</span>
                </div>
            </div>
        </section>

        <div class="divider"></div>

        <!-- SECTION 3: QUOTE -->
        <section class="quote-section">
            <div class="quote-text">
                Там, где поселилась любовь, растёт радость
            </div>
            <img src="./photo2.jpg" alt="Пара" class="love-photo-img">
        </section>

        <div class="divider"></div>

        <!-- SECTION 4: COUPLE PHOTOS -->
        <section class="couple-section">
            <div class="couple-photos">
                <img src="./photo3.jpg" alt="Евгений" class="couple-photo">
                <img src="./photo4.jpg" alt="Светлана" class="couple-photo">
            </div>
            <div class="couple-names">
                <span>Евгений</span>
                <span>Светлана</span>
            </div>
        </section>

        <div class="divider"></div>

        <!-- SECTION 5: RSVP (ПОДТВЕРЖДЕНИЕ В СТИЛЕ КАРТОЧКИ) -->
        <section class="rsvp-section">
            <div class="paper-card">
                <!-- Реалистичная SVG скрепка -->
                <svg class="clip-icon" viewBox="0 0 40 90" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M14 25 V65 C14 73 26 73 26 65 V18 C26 7 8 7 8 18 V68 C8 82 34 82 34 68 V28" 
                          stroke="#8a8a8a" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                
                <div class="rsvp-title">ПОДТВЕРЖДЕНИЕ</div>
                <div class="rsvp-subtitle">
                    Пожалуйста, подтвердите свое присутствие до 10.09.2026
                </div>
            </div>
        </section>

        <div class="divider"></div>

        <!-- SECTION 6: MAP SECTION (ЯНДЕКС КАРТЫ - ул. Светлая 31) -->
        <section class="location-section">
            <div class="location-title">Локация</div>
            <div class="location-address">ул. Светлая 31</div>
            <div class="map-wrapper">
                <iframe src="https://yandex.ru/map-widget/v1/?text=%D1%83%D0%BB.+%D0%A1%D0%B2%D0%B5%D1%82%D0%BB%D0%B0%D1%8F+31&z=16" allowfullscreen="true"></iframe>
            </div>
        </section>

    </div>

    <!-- SCRIPT -->
    <script>
        // ===== TIMER SCRIPT =====
        const weddingDate = new Date('2026-10-24T14:00:00+03:00').getTime();

        function updateTimer() {
            const now = new Date().getTime();
            const diff = weddingDate - now;

            if (diff > 0) {
                const totalSeconds = Math.floor(diff / 1000);
                const totalMinutes = Math.floor(totalSeconds / 60);
                const totalHours = Math.floor(totalMinutes / 60);
                const totalDays = Math.floor(totalHours / 24);

                const weeks = Math.floor(totalDays / 7);
                const days = totalDays % 7;
                const hours = totalHours % 24;
                const minutes = totalMinutes % 60;
                const seconds = totalSeconds % 60;

                document.getElementById('weeks').textContent = String(weeks).padStart(2, '0');
                document.getElementById('days').textContent = String(days).padStart(2, '0');
                document.getElementById('hours').textContent = String(hours).padStart(2, '0');
                document.getElementById('minutes').textContent = String(minutes).padStart(2, '0');
                document.getElementById('seconds').textContent = String(seconds).padStart(2, '0');
            }
        }

        updateTimer();
        setInterval(updateTimer, 1000);

        // ===== MUSIC PLAYER SCRIPT =====
        const music = document.getElementById('wedding-music');
        const musicToggle = document.getElementById('music-toggle');
        const enterBtn = document.getElementById('enter-btn');
        const overlay = document.getElementById('welcome-overlay');
        let isPlaying = false;

        function startMusic() {
            music.volume = 0.8;
            const promise = music.play();
            if (promise !== undefined) {
                promise.then(() => {
                    isPlaying = true;
                    musicToggle.classList.add('playing');
                }).catch(error => {
                    console.error("Ошибка воспроизведения:", error);
                });
            }
        }

        enterBtn.addEventListener('click', () => {
            document.body.classList.remove('no-scroll');
            overlay.classList.add('hidden');
            startMusic();
        });

        musicToggle.addEventListener('click', () => {
            if (isPlaying) {
                music.pause();
                musicToggle.classList.remove('playing');
                isPlaying = false;
            } else {
                startMusic();
            }
        });
    </script>
</body>
</html>
